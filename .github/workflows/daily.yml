name: 多伦多新闻早报 · 每日自动生成

# 这个工作流跑在 GitHub 的服务器上，跟你的电脑有没有开机完全无关。
# 每天自动生成一期早报，并发布成一个固定网址，任何手机任何网络都能打开。

on:
  schedule:
    # GitHub 的定时器用 UTC。12:00 UTC = 多伦多上午 8:00（夏令时 EDT）
    # 冬令时（EST, UTC-5）会变成上午 7:00。
    - cron: "0 12 * * *"
  push:
    branches: [main]
    # 只有「代码或配置」变了才自动跑。
    # 云端自己归档早报时只改 output/ 和 docs/，不在列表里 → 不会自己触发自己。
    paths:
      - "generate.py"
      - "build_site.py"
      - "config/**"
      - ".github/workflows/daily.yml"
  workflow_dispatch:            # 也支持手动点一下立刻生成
    inputs:
      force:
        description: 覆盖今天已生成的早报
        type: boolean
        default: true

permissions:
  contents: write               # 提交当日早报，保留往期
  pages: write                  # 发布网页
  id-token: write               # GitHub Pages 部署需要

concurrency:
  group: toronto-news-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: America/Toronto
      TORONTO_TZ: America/Toronto
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 官方 Pages 流程的前置步骤（读取/初始化 Pages 配置）
      - name: 配置 Pages
        uses: actions/configure-pages@v5

      # 密钥缺失时立刻失败并给出明确指引，而不是悄悄产出一份英文早报。
      - name: 检查 Gemini 密钥
        run: |
          if [ -z "${GEMINI_API_KEY}" ]; then
            echo "::error title=缺少密钥::还没配置 GEMINI_API_KEY。请到仓库 Settings → Secrets and variables → Actions → New repository secret，名称填 GEMINI_API_KEY，值填你在 Google AI Studio 拿到的 key。"
            exit 1
          fi
          echo "密钥已就绪（长度 ${#GEMINI_API_KEY}）"

      - name: 抓取并生成早报（Gemini 生成中文）
        run: python3 generate.py --force --quiet --stats

      - name: 构建手机网页
        run: python3 build_site.py

      # 把关键指标打到日志里，出问题不用打开网页猜
      - name: 生成结果摘要
        run: |
          echo "条数 : $(grep -o '精选 <b>[0-9]*' docs/index.html | head -1)"
          echo "中文 : $(grep -o '已生成 [0-9]*/[0-9]* 条中文' docs/index.html | head -1)"
          echo "配图 : $(grep -c 'class=\"cover\"' docs/index.html) 张"
          echo "版本 : $(grep -o 'var TN_BUILD=\"[0-9]*\"' docs/index.html | head -1)"

      # 闸门：只要有任何冲突标记，就不许发布。
      - name: 发布前自检（拦截 git 冲突标记）
        run: |
          # 不锚定行首：两个页面被拼到同一行时，标记会出现在行中间
          if grep -rq '<<<<<<<' docs || grep -rq '>>>>>>>' docs \
             || grep -rqE '^[[:space:]]*={7}[[:space:]]*$' docs; then
            echo "::error title=检测到冲突标记::docs/ 里混入了 git 冲突标记，已阻止发布。"
            grep -rn '<<<<<<<\|>>>>>>>' docs | head -5
            exit 1
          fi
          echo "自检通过：docs/ 无冲突标记"

      # 打包必须放在「保存本期」之前！
      # git pull --rebase 一旦冲突，会把冲突标记写进工作区；若那之后再打包，
      # 就会把带 <<<<<<< HEAD 的页面发布上线（踩过两次）。
      - name: 打包网页
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: 保存本期（保留往期，供下次去重与归档）
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # docs/ 已被 .gitignore 排除（纯构建产物，发布走 artifact），只归档 output/
          git add -A output
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "早报自动更新 $(TZ=America/Toronto date +%Y-%m-%d)"
            # 排队的多个运行会互相抢提交：先变基再推。
            # 变基冲突必须 abort，否则工作区会残留冲突标记。
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo "::warning::远端有新提交，本期归档未推上（网页已发布，明天自动重试）"
            else
              git push || echo "::warning::归档推送失败（网页已发布，明天自动重试）"
            fi
          fi

      - name: 发布到公网
        id: deploy
        uses: actions/deploy-pages@v4

      # 邮件推送放在最后：网页已上线，邮件里的链接一定可用。
      # 没配 MAIL_USER/MAIL_PASS 时会安静跳过，不影响早报发布。
      - name: 邮件推送（未配置则跳过）
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python3 notify.py
