<body>
  <div class="card">
    <div class="mark">耳</div>

    <a id="enter" href="https://erpan-zhenxuan.app.workbuddy.host/?sharecode=5WXYLRAUPD">点击进入收听</a>

<script>
  // 永久跳板：用 JSONP 读取本体上的版本信标（跨域名，script 标签不受同源限制）。
  // 信标 URL 带时间戳，微信不会缓存，永远拿到最新目标地址。
  // 本逻辑一次装好不再改变 —— 以后升级只改本体的 version.js，链接与二维码都不用换。
  var BASE = 'https://erpan-zhenxuan.app.workbuddy.host/';
  var FALLBACK = 'https://erpan-zhenxuan.app.workbuddy.host/?sharecode=5WXYLRAUPD';
  var done = false;
  function go(url) {
    if (done) return;
    done = true;
    document.getElementById('enter').href = url;
    location.replace(url);
  }
  window.__ERPAN_TARGET__ = null;
  window.__onVersion = function () {
    go(window.__ERPAN_TARGET__ || FALLBACK);
  };
  var s = document.createElement('script');
  s.src = BASE + 'version.js?t=' + Date.now() + '&sharecode=5WXYLRAUPD';
  s.onerror = function () { go(FALLBACK); };
  document.head.appendChild(s);
  setTimeout(function () { go(FALLBACK); }, 3000);
</script>
